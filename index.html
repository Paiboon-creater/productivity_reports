<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAGUAR // PRODUCTION REPORT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- โหลดไลบรารีสำหรับสร้างกราฟ (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* THEME: DEEP SLATE & AMBER */
    :root {
      --bg-main: #1e1e2f;
      --panel-bg: #27293d;
      --border-dark: #3b3b54;
      --text-main: #e4e4e4;
      --text-muted: #9a9a9a;
      
      --accent-amber: #ff8a76;
      --accent-blue: #1d8cf8;
      --accent-teal: #00f2c3;
      --accent-pink: #e14eca;
    }

    body {
      font-family: 'Courier New', Courier, monospace, 'Sarabun', sans-serif;
      background-color: var(--bg-main); color: var(--text-main);
      margin: 0; padding: 20px; font-size: 14px;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    .app-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 2px solid var(--border-dark); padding-bottom: 15px; margin-bottom: 20px;
    }
    .app-title { font-size: 24px; font-weight: bold; color: var(--accent-blue); margin: 0; letter-spacing: 1px; }
    .app-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 5px; }

    .btn {
      background: transparent; border: 1px solid; 
      padding: 8px 15px; border-radius: 6px; font-size: 14px;
      font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .btn-home { color: var(--accent-teal); border-color: var(--accent-teal); }
    .btn-home:hover { background: var(--accent-teal); color: #000; box-shadow: 0 0 10px rgba(0, 242, 195, 0.4); }
    .btn-submit { color: var(--accent-amber); border-color: var(--accent-amber); background: rgba(255,138,118,0.1); }
    .btn-submit:hover { background: var(--accent-amber); color: #000; }
    .btn-print { color: #f8fafc; border-color: #f8fafc; }
    .btn-print:hover { background: #f8fafc; color: #000; }

    /* FILTER SECTION */
    .filter-panel {
      background: var(--panel-bg); border: 1px solid var(--border-dark);
      padding: 20px; border-radius: 8px; margin-bottom: 20px;
      display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .filter-group { display: flex; align-items: center; gap: 10px; }
    .filter-group label { font-weight: bold; color: var(--accent-blue); }
    .filter-group input[type="date"] {
      background: #1a1a2e; color: #fff; border: 1px solid var(--border-dark);
      padding: 8px 12px; border-radius: 4px; font-family: inherit; font-size: 14px;
    }
    .filter-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    /* CHART & TABLE SECTION */
    .dashboard-grid {
      display: grid; grid-template-columns: 1fr; gap: 20px;
    }
    .card {
      background: var(--panel-bg); border: 1px solid var(--border-dark);
      padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .card-title { color: var(--accent-amber); margin-top: 0; margin-bottom: 20px; font-size: 18px; border-bottom: 1px dashed var(--border-dark); padding-bottom: 10px;}
    
    .chart-container { position: relative; height: 400px; width: 100%; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background-color: #1a1a2e; color: var(--text-muted); border-bottom: 2px solid var(--border-dark); padding: 12px; font-weight: bold; }
    td { padding: 12px; border-bottom: 1px solid var(--border-dark); font-size: 15px; }
    tr:hover td { background-color: var(--row-hover); }
    .text-right { text-align: right; }
    
    /* PRINT STYLES */
    @media print {
      body { background-color: #fff; color: #000; }
      .no-print, .filter-panel { display: none !important; }
      .card { border: none; box-shadow: none; padding: 0; }
      table { margin-top: 20px; }
      th { background-color: #f2f2f2 !important; color: #000; border: 1px solid #000; }
      td { border: 1px solid #999; color: #000 !important; }
      .app-title, .card-title { color: #000; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="app-header">
    <div>
      <h1 class="app-title"><i class="fa-solid fa-chart-column"></i> PRODUCTION PERFORMANCE REPORT</h1>
      <div class="app-subtitle">รายงานสรุปยอดการผลิตแยกตามขั้นตอนและรายเดือน</div>
    </div>
    <div class="no-print" style="display:flex; gap:10px;">
      <a href="index.html" class="btn btn-home" title="กลับหน้ากระดานค้างผลิต"><i class="fa-solid fa-layer-group"></i> WIP BOARD</a>
      <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> PRINT</button>
    </div>
  </div>

  <div class="filter-panel no-print">
    <div class="filter-group">
      <label><i class="fa-regular fa-calendar"></i> ตั้งแต่วันที่:</label>
      <input type="date" id="dateFrom">
    </div>
    <div class="filter-group">
      <label><i class="fa-regular fa-calendar"></i> ถึงวันที่:</label>
      <input type="date" id="dateTo">
    </div>
    <button class="btn btn-submit" onclick="fetchAndRenderReport()"><i class="fa-solid fa-magnifying-glass"></i> ประมวลผลรายงาน</button>
    <span id="loadingMsg" style="color:var(--accent-teal); display:none; margin-left: 10px;"><i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงข้อมูล...</span>
  </div>

  <div class="dashboard-grid">
    <!-- ส่วนแสดงกราฟ -->
    <div class="card">
      <h2 class="card-title"><i class="fa-solid fa-chart-bar"></i> กราฟยอดผลิตรายเดือน (แยกตามขั้นตอน)</h2>
      <div class="chart-container">
        <canvas id="productionChart"></canvas>
      </div>
    </div>

    <!-- ส่วนแสดงตารางสรุป -->
    <div class="card">
      <h2 class="card-title"><i class="fa-solid fa-table"></i> ตารางสรุปยอดผลิตรวม (ตามช่วงเวลาที่กรอง)</h2>
      <table id="summaryTable">
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>ขั้นตอนการทำงาน</th>
            <th class="text-right">ยอดรวมผลิตได้ (ชิ้น)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="3" class="text-center" style="color:var(--text-muted)">กรุณากดปุ่ม "ประมวลผลรายงาน"</td></tr>
        </tbody>
        <tfoot id="tableFoot" style="font-weight:bold; color:var(--accent-teal); background-color:#1a1a2e; display:none;">
          <tr>
            <td colspan="2" class="text-right">รวมยอดผลิตทั้งหมด:</td>
            <td id="grandTotal" class="text-right">0</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

</div>

<script>
  // การตั้งค่าฐานข้อมูล
  const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
  const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  let myChart = null; // ตัวแปรเก็บ Object ของกราฟ
  
  // ลำดับขั้นตอนตามสายพาน (เรียงในตาราง)
  const customStepOrder = ["ตัดเหรียญมือ", "ตัดเหรียญออโต", "ตัดมุม", "รีดใบ", "ตัดใบ", "เจาะซี่", "ตีตรา", "ตีลาย", "ขึ้นรูป"];
  // สีประจำขั้นตอน (สุ่มไว้ให้แตกต่างกันในกราฟ)
  const stepColors = {
    "ตัดเหรียญมือ": "#ff8a76", "ตัดเหรียญออโต": "#ffb236", "ตัดมุม": "#ffd600",
    "รีดใบ": "#1d8cf8", "ตัดใบ": "#00f2c3", "เจาะซี่": "#e14eca",
    "ตีตรา": "#ba54f5", "ตีลาย": "#00d6b4", "ขึ้นรูป": "#3358f4"
  };

  // ตั้งค่าวันที่ Default (ต้นเดือน - วันนี้)
  window.onload = function() {
    let today = new Date();
    let firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    
    document.getElementById('dateTo').value = today.toISOString().split('T')[0];
    // ปรับ Timezone ง่ายๆ ป้องกันวันที่เลื่อน
    let tzOffset = (new Date()).getTimezoneOffset() * 60000;
    let localFirstDay = (new Date(firstDay - tzOffset)).toISOString().split('T')[0];
    document.getElementById('dateFrom').value = localFirstDay;
    
    // โหลดข้อมูลอัตโนมัติเมื่อเข้าหน้าเว็บ
    fetchAndRenderReport();
  };

  // ฟังก์ชันหลัก: ดึงข้อมูลและสร้างรายงาน
  async function fetchAndRenderReport() {
    document.getElementById('loadingMsg').style.display = 'inline-block';
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;

    try {
      // 1. ดึงข้อมูลดิบจากฐานข้อมูล
      const [prodRes, targetsRes, stepsRes] = await Promise.all([
        // ดึงเฉพาะข้อมูลผลิตที่อยู่ในช่วงวันที่ที่เลือก
        fetch(`${SUPABASE_URL}/daily_production?select=id_target,produced_amount,record_date&record_date=gte.${dateFrom}&record_date=lte.${dateTo}`, { headers }), 
        fetch(`${SUPABASE_URL}/targets?select=id_target,id_step`, { headers }),
        fetch(`${SUPABASE_URL}/production_steps?select=id_step,step_name`, { headers })
      ]);

      if (!prodRes.ok) throw new Error("โหลดข้อมูลล้มเหลว");

      const productions = await prodRes.json();
      const targets = await targetsRes.json();
      const steps = await stepsRes.json();

      // 2. จับคู่ข้อมูล (Mapping) id_target -> id_step -> step_name
      let targetToStepName = {};
      targets.forEach(t => {
        let step = steps.find(s => String(s.id_step) === String(t.id_step));
        targetToStepName[t.id_target] = step ? step.step_name : "อื่นๆ";
      });

      // 3. จัดกลุ่มข้อมูล (Grouping)
      let summaryByStep = {}; // สำหรับตาราง
      let monthlyDataByStep = {}; // สำหรับกราฟ
      let uniqueMonths = new Set();

      productions.forEach(prod => {
        let stepName = targetToStepName[prod.id_target] || "ไม่มีระบุขั้นตอน";
        let amount = parseInt(prod.produced_amount) || 0;
        
        if (amount === 0) return;

        // ดึง ปี-เดือน (เช่น "2026-08")
        let dateObj = new Date(prod.record_date);
        let monthStr = `${dateObj.getFullYear()}-${(dateObj.getMonth() + 1).toString().padStart(2, '0')}`;
        
        uniqueMonths.add(monthStr);

        // รวมยอดสำหรับตาราง
        if (!summaryByStep[stepName]) summaryByStep[stepName] = 0;
        summaryByStep[stepName] += amount;

        // รวมยอดสำหรับกราฟ (แยกตามเดือน)
        if (!monthlyDataByStep[stepName]) monthlyDataByStep[stepName] = {};
        if (!monthlyDataByStep[stepName][monthStr]) monthlyDataByStep[stepName][monthStr] = 0;
        monthlyDataByStep[stepName][monthStr] += amount;
      });

      // 4. วาดตารางและกราฟ
      renderTable(summaryByStep);
      renderChart(monthlyDataByStep, Array.from(uniqueMonths).sort());

    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      document.getElementById('loadingMsg').style.display = 'none';
    }
  }

  // ฟังก์ชันวาดตาราง
  function renderTable(summaryData) {
    const tbody = document.getElementById('tableBody');
    const tfoot = document.getElementById('tableFoot');
    tbody.innerHTML = '';
    
    let grandTotal = 0;
    
    // แปลง Object เป็น Array เพื่อเรียงลำดับ
    let rows = Object.keys(summaryData).map(stepName => {
      return { step: stepName, total: summaryData[stepName] };
    });

    // เรียงตามสายพาน
    rows.sort((a, b) => {
      let iA = customStepOrder.indexOf(a.step.trim());
      let iB = customStepOrder.indexOf(b.step.trim());
      if (iA !== -1 && iB !== -1) return iA - iB;
      if (iA !== -1) return -1;
      if (iB !== -1) return 1;
      return a.step.localeCompare(b.step, 'th');
    });

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="color:var(--accent-pink)">ไม่พบยอดการผลิตในช่วงวันที่ระบุ</td></tr>';
      tfoot.style.display = 'none';
      return;
    }

    rows.forEach((row, index) => {
      grandTotal += row.total;
      tbody.innerHTML += `
        <tr>
          <td>${index + 1}</td>
          <td style="color:var(--accent-blue); font-weight:bold;">${row.step}</td>
          <td class="text-right" style="color:#fff;">${row.total.toLocaleString()}</td>
        </tr>
      `;
    });

    document.getElementById('grandTotal').innerText = grandTotal.toLocaleString();
    tfoot.style.display = 'table-row-group';
  }

  // ฟังก์ชันวาดกราฟแท่ง (Chart.js)
  function renderChart(monthlyData, monthsArray) {
    const ctx = document.getElementById('productionChart').getContext('2d');
    
    // ทำลายกราฟเก่าทิ้งก่อนวาดใหม่ ป้องกันบัคภาพซ้อน
    if (myChart) { myChart.destroy(); }

    if (monthsArray.length === 0) { return; } // ไม่มีข้อมูล ไม่ต้องวาด

    // แปลงรูปแบบ "2026-08" ให้เป็นชื่อเดือนสวยๆ เช่น "ส.ค. 2026"
    const monthNamesThai = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const labels = monthsArray.map(mStr => {
      let [year, month] = mStr.split('-');
      return `${monthNamesThai[parseInt(month)-1]} ${year}`;
    });

    // เตรียม Dataset ให้กราฟแท่ง (1 ขั้นตอน = 1 สี)
    let datasets = [];
    Object.keys(monthlyData).forEach((stepName, index) => {
      // ดึงข้อมูลเรียงตามเดือนที่แกน X
      let dataPoints = monthsArray.map(mStr => monthlyData[stepName][mStr] || 0);
      
      // เลือกสี
      let color = stepColors[stepName.trim()] || `hsl(${(index * 50) % 360}, 70%, 60%)`;

      datasets.push({
        label: stepName,
        data: dataPoints,
        backgroundColor: color,
        borderColor: color,
        borderWidth: 1,
        borderRadius: 4
      });
    });

    // วาดกราฟ
    myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels, // แกน X (เดือน)
        datasets: datasets // ข้อมูลแท่ง
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: { color: '#e4e4e4', font: { family: 'Sarabun' } }
          },
          tooltip: {
            mode: 'index',
            intersect: false,
            titleFont: { family: 'Sarabun' },
            bodyFont: { family: 'Sarabun' }
          }
        },
        scales: {
          x: {
            ticks: { color: '#9a9a9a', font: { family: 'Sarabun' } },
            grid: { color: '#3b3b54' }
          },
          y: {
            ticks: { color: '#9a9a9a', font: { family: 'Sarabun' } },
            grid: { color: '#3b3b54' },
            beginAtZero: true
          }
        }
      }
    });
  }
</script>

</body>
</html>
